---
Wizard:
  - "Close thine eyes and rest..."
  - "Your sacrifice shall be writ."
  - "A step closer to Godhood."
Witch:
  - "May Qiphoth accept your Sinless soul."
  - "Qiphoth let you rise with us."
  - "I've seen the threshold for a moment..."
Knight:
  - "Thy Sin shall be returned."
  - "Hastr be my guide..."
  - "A bit more until the Red comes."
Monk:
  - "The Red whips my soul with each death."
  - "We don't take life, only Sin."
  - "I move with the Spheres."
Sage:
  - "I take as I shall give."
  - "Balance in everything."
  - "I give as I shall take."
Priest:
  - "Ghylag take thine breath as I take thy Sin."
  - "Lay there, beheaded, closer to God."
  - "The Red shall take thine bones and make you precious."
Thief:
  - "Thank the Bells this head ain't mine."
  - "I do what I do best, keep taking..."
  - "..."
